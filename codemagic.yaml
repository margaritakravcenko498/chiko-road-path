workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
      node: 22.11.0
      # Create this keystore entry in Codemagic UI and set its
      # reference name to "release_keystore".
      android_signing:
        - release_keystore
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Configure Android SDK path
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build Android AAB (release)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --refresh-dependencies --stacktrace \
            -Pandroid.useAndroidX=true \
            -PMYAPP_RELEASE_STORE_FILE="$CM_KEYSTORE_PATH" \
            -PMYAPP_RELEASE_STORE_PASSWORD="$CM_KEYSTORE_PASSWORD" \
            -PMYAPP_RELEASE_KEY_ALIAS="$CM_KEY_ALIAS" \
            -PMYAPP_RELEASE_KEY_PASSWORD="$CM_KEY_PASSWORD"
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
