apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services' //new version
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'stringfog'

// Native string fog only (DEX). JS/Hermes is unchanged.
// fogPackages must stay on the host package — applyHostFragment rewrites it.
stringfog {
    implementation 'com.github.megatronking.stringfog.xor.StringFogImpl'
    packageName "com.ychikwordcdwpavbth389t8"
    enable true
    fogPackages = ["com.ychikwordcdwpavbth389t8"]
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
// rn-obfuscator-begin
def enableProguardInReleaseBuilds = true
// rn-obfuscator-end
/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def hermesEnabled = project.hasProperty("hermesEnabled") ? project.hermesEnabled.toBoolean() : true
// Expose Hermes flag for libraries (e.g. react-native-worklets).
ext.hermesEnabled = hermesEnabled

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ychikwordcdwpavbth389t8"
    defaultConfig {
        applicationId "com.Zptgsgh.LFkWKCg"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    aaptOptions {
    // Files with these extensions are stored in the APK uncompressed
    // noCompress "png"
    // If you also want webp/jpg without recompression:
    // noCompress "png", "webp", "jpg", "jpeg"
    cruncherEnabled true  // disables PNG crunch recompression
  }

    packaging {
        pickFirst 'lib/arm64-v8a/libworklets.so'
        pickFirst 'lib/armeabi-v7a/libworklets.so'
        pickFirst 'lib/x86/libworklets.so'
        pickFirst 'lib/x86_64/libworklets.so'
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android")
    implementation platform("com.google.firebase:firebase-bom:34.10.0")
    implementation "com.google.firebase:firebase-messaging"

//new
    implementation ('com.google.android.gms:play-services-appset:16.1.0')
    implementation(platform("com.google.firebase:firebase-bom:34.10.0"))

    // WebKit dependency for Payment Request API
    implementation ('androidx.webkit:webkit:1.14.0')
    // AndroidX Activity dependency for ComponentActivity
    implementation ('androidx.activity:activity:1.8.2')
    // AndroidX Core dependency for Context and other base classes
    implementation ('androidx.core:core:1.12.0')
    // AndroidX AppCompat dependency for Activity base classes
    implementation ('androidx.appcompat:appcompat:1.6.1')
    // Fragment dependency for Activity compatibility
    implementation ('androidx.fragment:fragment:1.6.2')
    // Lifecycle dependencies
    implementation ('androidx.lifecycle:lifecycle-runtime:2.7.0')
    implementation ('androidx.lifecycle:lifecycle-common:2.7.0')
    
    // Google Play Services for Advertising ID and App Set ID
    implementation ('com.google.android.gms:play-services-ads-identifier:18.0.1')
    implementation 'com.google.android.play:integrity:1.4.0'

    implementation 'com.parse.bolts:bolts-tasks:1.4.0'
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.11.0'
//new

    // net-stack-begin
    implementation 'com.google.code.gson:gson:2.11.0'
    // net-stack-end

    if (hermesEnabled) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// rn-obfuscator-strings-begin
// Helper EncryptMain off — StringFog covers native literals. Do not run both.
// rn-obfuscator-strings-end
