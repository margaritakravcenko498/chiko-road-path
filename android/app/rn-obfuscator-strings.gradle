// Generated by RN App Helper. Encrypts string literals in release app classes.
def rnObfReserved = new File(project.projectDir, "rn-obfuscator-reserved.txt")
def rnObfJavaDir = new File(project.projectDir, "rn-obfuscator/java")
def rnObfClasses = layout.buildDirectory.dir("rn-obfuscator/classes")

def rnObfAsm = configurations.detachedConfiguration(
    dependencies.create("org.ow2.asm:asm:9.7.1"),
    dependencies.create("org.ow2.asm:asm-tree:9.7.1")
)
rnObfAsm.transitive = true

tasks.register("compileRnStringEncryptor", JavaCompile) {
    source = fileTree(dir: rnObfJavaDir, include: "**/*.java")
    classpath = rnObfAsm
    destinationDirectory.set(rnObfClasses)
    sourceCompatibility = "17"
    targetCompatibility = "17"
    options.encoding = "UTF-8"
}

afterEvaluate {
    def rnCompileSdk = null
    try {
        rnCompileSdk = android.compileSdk
    } catch (Throwable ignored) {
    }
    if (rnCompileSdk == null) {
        rnCompileSdk = android.compileSdkVersion
    }
    def rnAndroidJar = new File(android.sdkDirectory, "platforms/android-${rnCompileSdk}/android.jar")

    tasks.register("encryptRnReleaseStrings") {
        dependsOn("compileRnStringEncryptor")
        ["compileReleaseKotlin", "compileReleaseJavaWithJavac"].each { taskName ->
            if (tasks.findByName(taskName) != null) {
                dependsOn(taskName)
            }
        }
        doLast {
            def classDirs = []
            def classpathEntries = new LinkedHashSet<String>()
            if (rnAndroidJar.exists()) {
                classpathEntries.add(rnAndroidJar.absolutePath)
            }
            ["compileReleaseKotlin", "compileReleaseJavaWithJavac"].each { taskName ->
                def compileTask = tasks.findByName(taskName)
                if (compileTask == null) return
                if (compileTask.hasProperty("classpath") && compileTask.classpath != null) {
                    compileTask.classpath.files.each { file ->
                        classpathEntries.add(file.absolutePath)
                    }
                }
                if (compileTask.hasProperty("destinationDirectory") && compileTask.destinationDirectory != null) {
                    def outDir = compileTask.destinationDirectory.get().asFile
                    if (outDir.exists()) {
                        classDirs.add(outDir.absolutePath)
                        classpathEntries.add(outDir.absolutePath)
                    }
                }
            }
            if (classDirs.isEmpty()) {
                throw new GradleException("rn-obfuscator: release class directories were not found")
            }
            def classpathFile = layout.buildDirectory.file("rn-obfuscator/classpath.txt").get().asFile
            def hashFile = layout.buildDirectory.file("rn-obfuscator/class-hashes.txt").get().asFile
            classpathFile.parentFile.mkdirs()
            classpathFile.write(classpathEntries.join("\n"), "UTF-8")
            javaexec {
                classpath = files(rnObfClasses, rnObfAsm)
                mainClass.set("com.rnobfuscator.EncryptMain")
                args(
                    [
                        rnObfReserved.absolutePath,
                        rnAndroidJar.absolutePath,
                        classpathFile.absolutePath,
                        hashFile.absolutePath,
                    ] + classDirs
                )
            }
        }
    }

    ["minifyReleaseWithR8", "dexBuilderRelease"].each { taskName ->
        def later = tasks.findByName(taskName)
        if (later != null) {
            later.dependsOn("encryptRnReleaseStrings")
        }
    }
}
